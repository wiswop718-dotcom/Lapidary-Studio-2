<style>
:root{color-scheme:dark;--ink:#eaf6ff;--mute:#9fb4ff;--acc:#22f3ff;--panel:rgba(10,8,34,.74);--line:rgba(255,255,255,.15);--card:#0b0d24;

canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#cut2{pointer-events:none}
.top{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);padding:12px 16px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.money{font-size:13px;color:var(--mute)}.money b{color:var(--ink);font-size:18px}
.gauge{width:56%;max-width:260px}
.lab{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-bottom:4px}
.lab b{color:var(--ink);font-size:20px}
.bar{height:10px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);border-radius:5px;transition:width .12s}
.hint{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 74px);text-align:center;font-size:14px;color:var(--mute);pointer-events:none;line-height:1.6;padding:0 16px;text-shadow:0 1px 6px #000}

.bot{position:fixed;left:0;right:0;bottom:0;padding:12px 12px calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center;align-items:center}

button.on{background:var(--acc);color:#06141f;border-color:var(--acc)}
button.gold{background:#ff3df0;color:#14052a;border-color:#ff3df0}

button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#act{flex:1;max-width:170px}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.tabs button{min-height:38px;padding:6px 11px;font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}

#photoImg{width:100%;border-radius:12px;display:block}
.ov{perspective:900px}
.card,.shop{animation:pop .5s cubic-bezier(.2,.9,.3,1.15) backwards;transform-origin:50% 100%}
@keyframes pop{from{opacity:0;transform:rotateX(-75deg) translateY(50px) scale(.9)}to{opacity:1;transform:none}}
button{transition:transform .12s,box-shadow .12s,background .2s;box-shadow:0 4px 0 rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.22)}
button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.4)}
.bot{perspective:600px}
.bot button{animation:bin .7s cubic-bezier(.2,.9,.3,1.2) backwards}
.bot button:nth-child(2){animation-delay:.07s}.bot button:nth-child(3){animation-delay:.14s}.bot button:nth-child(4){animation-delay:.21s}
@keyframes bin{from{opacity:0;transform:rotateX(70deg) translateY(40px)}to{opacity:1;transform:none}}

.grade{animation:gr 1s cubic-bezier(.2,.9,.3,1.3) .15s backwards}
@keyframes gr{from{opacity:0;transform:perspective(500px) rotateY(540deg) scale(.3)}to{opacity:1;transform:none}}
.row.ani{animation:rowin .45s cubic-bezier(.2,.9,.3,1.1) backwards;transform-origin:50% 0}
@keyframes rowin{from{opacity:0;transform:perspective(500px) rotateX(-70deg)}to{opacity:1;transform:none}}
.shop{perspective:700px}
.sc{width:34px;height:34px;perspective:240px}
.cube{position:relative;width:34px;height:34px;transform-style:preserve-3d;animation:cs 8s linear infinite}
.cube i{position:absolute;inset:0;border:1px solid rgba(255,255,255,.55);background:linear-gradient(135deg,rgba(34,243,255,.6),rgba(160,120,255,.25))}

@keyframes cs{to{transform:rotateX(360deg) rotateY(360deg)}}
.tg{position:relative;height:18px;border-radius:9px;background:rgba(255,255,255,.12);margin:14px 0;overflow:hidden}
.tg .zone{position:absolute;top:0;bottom:0;background:rgba(34,243,255,.5)}

.bar{height:12px;border-radius:7px;background:rgba(0,0,0,.55);border:1px solid rgba(34,243,255,.35);box-shadow:inset 0 2px 4px rgba(0,0,0,.7);position:relative}
.bar::after{content:"";position:absolute;inset:0;border-radius:7px;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),rgba(0,0,0,.45) calc(10% - 1px) 10%);pointer-events:none}
.bar i{background:linear-gradient(90deg,#3a1a9a,#22f3ff,#e4fdff,#22f3ff,#7a3dff);background-size:200% 100%;box-shadow:0 0 12px rgba(34,243,255,.8)}

<style id="neon2">/* ===== ネオン出現アニメーション ===== */

@keyframes nboot{
 0%{opacity:0;clip-path:inset(49.6% -70px 49.6% -70px);transform:scaleX(.5);filter:brightness(3) drop-shadow(0 0 20px #22f3ff)}
 16%{opacity:1;clip-path:inset(49.2% -70px 49.2% -70px);transform:scaleX(1);filter:brightness(2.4) drop-shadow(0 0 26px #22f3ff)}
 52%{clip-path:inset(-70px);transform:none;filter:brightness(1.9) drop-shadow(0 0 26px #ff3df0)}
 60%{opacity:.55}64%{opacity:1}70%{opacity:.7;transform:translateX(4px) skewX(-2deg)}74%{opacity:1;transform:translateX(-2px)}78%{transform:none}
 100%{clip-path:inset(-70px);filter:none}}

.card>:nth-child(5),.shop>:nth-child(5){animation-delay:.5s}.card>:nth-child(6),.shop>:nth-child(6){animation-delay:.56s}.card>:nth-child(n+7),.shop>:nth-child(n+7){animation-delay:.62s}
@keyframes nin{0%{opacity:0;transform:translateX(-26px) skewX(-14deg);filter:blur(5px) brightness(2.6) drop-shadow(0 0 10px #22f3ff)}55%{opacity:1;transform:translateX(5px) skewX(3deg);filter:brightness(1.7) drop-shadow(0 0 10px #ff3df0)}100%{opacity:1;transform:none;filter:none}}
